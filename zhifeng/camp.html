<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三维营地 · 织丰系列</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-md navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">织丰 · 骑砍2系列</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
            <li class="nav-item"><a class="nav-link" href="battles.html">战报</a></li>
            <li class="nav-item"><a class="nav-link" href="stats.html">统计</a></li>
            <li class="nav-item"><a class="nav-link active" href="camp.html">三维营地</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-4">
    <h1>三维营地</h1>
    <p>织丰大营三维场景：拖动鼠标环视，滚轮缩放视角。</p>
    <div class="scene-box">
      <a-scene embedded>
        <a-sky color="#aee3f7"></a-sky>
        <a-plane position="0 0 0" rotation="-90 0 0" width="24" height="24" color="#7cb342"></a-plane>
        <a-text id="camp-count" value="织丰大营" align="center" color="#3e2723" position="0 3.6 -6" width="7"></a-text>
        <a-cone position="0 1 -6" radius-bottom="2" radius-top="0" height="2" color="#8d6e63"></a-cone>
        <a-cone position="-3.5 0.7 -4.5" radius-bottom="1.2" radius-top="0" height="1.4" color="#a1887f"></a-cone>
        <a-cone position="3.5 0.7 -4.5" radius-bottom="1.2" radius-top="0" height="1.4" color="#a1887f"></a-cone>
        <a-cylinder position="2 1.5 -6.5" radius="0.04" height="3" color="#616161"></a-cylinder>
        <a-box
          position="2.3 2.8 -6.5" width="0.7" height="0.45" depth="0.03" color="#b71c1c"
          animation="property: position; to: 2.38 2.8 -6.5; dir: alternate; dur: 900; loop: true">
        </a-box>
        <a-cone position="0 0.35 -2" radius-bottom="0.4" radius-top="0" height="0.7" color="#ff7043"></a-cone>
        <a-light type="point" position="0 1 -2" color="#ff9800" intensity="0.6"></a-light>
        <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
        <a-camera position="0 1.8 3"></a-camera>
      </a-scene>
    </div>
    <p id="camp-note" class="text-muted mt-2">营地标牌上的战役数量来自战报数据集，与战报模块共享。</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/dataset.js"></script>
  <script src="js/camp.js"></script>
</body>
</html>
