<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>战报 · 织丰系列</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-md navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">织丰 · 骑砍2系列</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
            <li class="nav-item"><a class="nav-link active" href="battles.html">战报</a></li>
            <li class="nav-item"><a class="nav-link" href="stats.html">统计</a></li>
            <li class="nav-item"><a class="nav-link" href="camp.html">三维营地</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-4">
    <h1>战报</h1>
    <p id="load-status" class="alert alert-warning my-3" hidden></p>

    <section class="my-4">
      <h2 class="h5">筛选</h2>
      <div class="row g-2 mt-2">
        <div class="col-6 col-md-3">
          <select id="chapter-filter" class="form-select">
            <option value="all">全部章节</option>
            <option value="第一章">第一章</option>
            <option value="第二章">第二章</option>
            <option value="第三章">第三章</option>
          </select>
        </div>
        <div class="col-6 col-md-3">
          <select id="result-filter" class="form-select">
            <option value="all">全部结果</option>
            <option value="胜利">胜利</option>
            <option value="失败">失败</option>
          </select>
        </div>
      </div>
    </section>

    <section class="my-4">
      <h2 class="h5">战役列表</h2>
      <div class="row g-3 mt-2" id="battle-list"></div>
      <p id="empty-tip" class="text-muted mt-3" hidden>没有符合条件的战报</p>
    </section>

    <section class="my-4">
      <h2 class="h5" id="form-title">录入战报</h2>
      <form id="battle-form" class="row g-3 mt-2" novalidate>
        <input type="hidden" id="battle-id">
        <div class="col-md-4">
          <label class="form-label" for="battle-name">战役名称</label>
          <input type="text" id="battle-name" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label" for="battle-chapter">章节</label>
          <select id="battle-chapter" class="form-select">
            <option value="第一章">第一章</option>
            <option value="第二章">第二章</option>
            <option value="第三章">第三章</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label" for="battle-enemy">对阵势力</label>
          <input type="text" id="battle-enemy" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label" for="battle-result">结果</label>
          <select id="battle-result" class="form-select">
            <option value="胜利">胜利</option>
            <option value="失败">失败</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label" for="battle-troops">投入兵力</label>
          <input type="number" id="battle-troops" class="form-control" min="0" required>
        </div>
        <div class="col-md-4">
          <label class="form-label" for="battle-loss">损失兵力</label>
          <input type="number" id="battle-loss" class="form-control" min="0" required>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">保存</button>
          <button type="button" id="reset-btn" class="btn btn-outline-secondary" hidden>取消编辑</button>
          <button type="button" id="clear-btn" class="btn btn-outline-secondary btn-sm ms-2">清除本地数据</button>
          <span id="form-tip" class="text-danger ms-2"></span>
        </div>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/dataset.js"></script>
  <script src="js/battles.js"></script>
</body>
</html>
