<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>织丰 · 骑马与砍杀2游玩系列</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-md navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">织丰 · 骑砍2系列</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link active" href="index.html">首页</a></li>
            <li class="nav-item"><a class="nav-link" href="battles.html">战报</a></li>
            <li class="nav-item"><a class="nav-link" href="stats.html">统计</a></li>
            <li class="nav-item"><a class="nav-link" href="camp.html">三维营地</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="container my-4">
      <h1>「织丰」游玩系列</h1>
      <p>记录骑马与砍杀2中织丰势力的征战历程：战役战报、势力统计与三维营地。</p>
      <img
        src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Epic%20medieval%20battlefield%20at%20dawn%20with%20cavalry%20and%20banners%2C%20fantasy%20kingdom%20war%20scene%2C%20cinematic%20painting&image_size=landscape_16_9"
        alt="织丰系列战场插画" class="img-fluid rounded">
    </section>

    <section class="container my-4">
      <h2>模块入口</h2>
      <div class="row g-3 my-3">
        <div class="col-md-4">
          <div class="card h-100">
            <div class="card-body">
              <h3 class="card-title h5">战报</h3>
              <p class="card-text">织丰历次战役记录，支持筛选与增删改查。</p>
              <a href="battles.html" class="btn btn-primary">进入</a>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card h-100">
            <div class="card-body">
              <h3 class="card-title h5">统计</h3>
              <p class="card-text">战役兵力与胜负数据图表。</p>
              <a href="stats.html" class="btn btn-primary">进入</a>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card h-100">
            <div class="card-body">
              <h3 class="card-title h5">三维营地</h3>
              <p class="card-text">三维视角浏览织丰大营。</p>
              <a href="camp.html" class="btn btn-primary">进入</a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="container my-4">
      <h2>最新战报</h2>
      <p>占位：展示最近三场战役，数据与战报模块共享同一数据集。</p>
    </section>
  </main>

  <footer class="bg-dark text-light py-3 mt-4">
    <div class="container">织丰系列记录站 · 数据来源：战报记录数据集</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
