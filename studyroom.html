<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园自习助手 - 自习室</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">校园自习助手</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
          <li class="nav-item"><a class="nav-link active" href="studyroom.html">自习室</a></li>
          <li class="nav-item"><a class="nav-link" href="stats.html">统计</a></li>
          <li class="nav-item"><a class="nav-link" href="campus3d.html">校园三维</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <h1>自习室</h1>
    <div class="row g-2 my-3">
      <div class="col-6 col-md-3">
        <select id="floor-filter" class="form-select">
          <option value="all">全部楼层</option>
          <option value="一楼">一楼</option>
          <option value="二楼">二楼</option>
          <option value="三楼">三楼</option>
        </select>
      </div>
      <div class="col-6 col-md-3">
        <select id="status-filter" class="form-select">
          <option value="all">全部状态</option>
          <option value="开放">开放</option>
          <option value="已满">已满</option>
          <option value="关闭">关闭</option>
        </select>
      </div>
    </div>
    <div class="row g-3" id="room-list"></div>
    <p id="empty-tip" class="text-muted" hidden>没有符合条件的自习室</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/studyroom.js"></script>
</body>
</html>
